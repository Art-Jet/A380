<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airbus A380 AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin:0; background:#f0f0f0; display:flex; justify-content:center; align-items:center; height:100vh; }
    model-viewer { width: 100%; max-width: 600px; height: 80vh; }
  </style>
</head>
<body>

<model-viewer
    src="model/airbus_a380.glb"
    ios-src="model/airbus_a380.usdz"
    ar
    ar-modes="webxr quick-look"
    camera-controls
    auto-rotate
    background-color="#ffffff">
</model-viewer>

</body>
</html>
